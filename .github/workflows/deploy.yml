# Build LernInseln and publish it to GitHub Pages.
#
# Unlike Tidegarden's workflow, this one publishes from the same repo it
# builds in. Tidegarden keeps a private source repo and force-pushes a
# built slice to a public one because it is a commercial game with art
# pipelines and design notes worth keeping back. LernInseln is a school
# learning app for one class: there is nothing here to keep back, and a
# single public repo is one fewer moving part to explain to whoever
# picks this up next.
#
# Everything the app needs is relative — `main.js`, `style.css`,
# `sw.js`, `assets/`, `icons/` — so it works unchanged at
# `/lerninseln/` on github.io and at the root of a custom domain.

name: deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # A broken build must never reach a child's iPad, so everything
      # runs before anything is uploaded.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # NOT --with-deps: that shells out to apt-get and is a known way
      # to hang a runner. The GitHub image already carries what
      # Chromium needs.
      - name: Install a browser for the harness
        timeout-minutes: 4
        run: npx playwright install chromium

      # Loads the built files the way a child's browser will, at a real
      # iPad viewport with touch on, and plays a whole round with taps.
      - name: Verify it actually plays
        timeout-minutes: 5
        run: node tools/verify.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
